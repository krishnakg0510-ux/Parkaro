<style>
:root{
 --paper:#F7F7F4; --ink:#14161C; --graphite:#696D77; --line:rgba(20,22,28,.11);
 --card:#FFFFFF; --accent:#2953F5; --accent-ink:#EEF1FF; --good:#1C8A5C; --good-bg:#E9F6EF;
 --warn:#B4391C; --warn-bg:#FBEAE5; --shadow:0 16px 40px rgba(20,22,28,.09); --shadow-sm:0 2px 10px rgba(20,22,28,.06);
 --r:12px; --rl:18px;
 padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
 :root:not([data-theme="light"]){--paper:#0D0E12; --ink:#F3F3F2; --graphite:#9A9DA6; --line:rgba(255,255,255,.11); --card:#16181F; --accent:#6E8CFF; --accent-ink:#1A2140; --good-bg:#12251C; --warn-bg:#2C1712; --shadow:0 16px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.35);}
}
:root[data-theme="dark"]{--paper:#0D0E12; --ink:#F3F3F2; --graphite:#9A9DA6; --line:rgba(255,255,255,.11); --card:#16181F; --accent:#6E8CFF; --accent-ink:#1A2140; --good-bg:#12251C; --warn-bg:#2C1712; --shadow:0 16px 40px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.35);}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border-radius:var(--r);border:1px solid transparent;font-weight:600;font-size:14px;background:none;transition:transform .12s ease,opacity .12s ease,background-color .12s ease}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(20,22,28,.06)}
.btn-p:hover{opacity:.93;transform:translateY(-1px)}
.btn-s{border-color:var(--line);color:var(--ink);background:var(--card)}
.btn-s:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-ghost{color:var(--graphite)}
.btn-ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
input,select,textarea{font-family:inherit;font-size:14.5px;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%;transition:border-color .12s ease,box-shadow .12s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ink)}
label{font-size:12.5px;font-weight:600;color:var(--graphite);display:block;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.muted{color:var(--graphite)}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.02em;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:16px;height:1.5px;background:var(--accent);display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:8px 14px;border-radius:100px;border:1px solid var(--line);background:var(--card);transition:background-color .12s ease,border-color .12s ease}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
header.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.topbar{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.logo{font-family:'Space Grotesk';font-weight:700;font-size:19px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.logo .dot{width:9px;height:9px;border-radius:3px;background:var(--accent)}
nav.mainnav{display:flex;gap:32px;font-size:14px;font-weight:600}
nav.mainnav a{color:var(--graphite);padding:8px 0;position:relative;transition:color .12s ease}
nav.mainnav a:hover{color:var(--ink)}
nav.mainnav a.active{color:var(--ink)}
nav.mainnav a.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;background:var(--card);position:relative;transition:border-color .12s ease}
.iconbtn:hover{border-color:var(--accent)}
.dot-badge{position:absolute;top:-3px;right:-3px;width:9px;height:9px;background:var(--accent);border-radius:50%;border:2px solid var(--paper)}

/* ---- HERO ---- */
.hero{padding:64px 0 0}
.hero-split{display:grid;grid-template-columns:1fr .92fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(34px,4.6vw,54px);line-height:1.05;letter-spacing:-.02em;margin:0 0 18px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--graphite);font-size:17px;line-height:1.6;max-width:480px;margin:0 0 30px}
.hero-visual{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;background:
  radial-gradient(120% 90% at 20% 10%, #3B63FF 0%, #24408F 46%, #101830 100%);
  box-shadow:var(--shadow)}
.hero-visual::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(100deg, rgba(255,255,255,.05) 0 2px, transparent 2px 64px)}
.float-card{position:absolute;background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;min-width:168px;z-index:2}
.float-card .fdot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto}
.float-card .fl{font-size:11px;color:var(--graphite);font-weight:600}
.float-card .fv{font-size:16px;font-weight:700;font-family:'Space Grotesk'}
.float-card.f1{top:26px;left:-18px}
.float-card.f2{bottom:26px;right:-18px}
.cta-row{display:flex;gap:14px;margin-top:6px;align-items:center}
section{padding:64px 0}
.grid-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{padding:16px;position:relative;transition:box-shadow .15s ease,transform .15s ease}
.pcard:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.pimg{height:132px;border-radius:9px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:12px;position:relative;color:var(--accent)}
.heart{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.94);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;z-index:2}
.heart.on{color:#E23; }
.pname{font-weight:700;font-size:15px;margin:2px 0 3px;letter-spacing:-.005em}
.prow{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font-weight:700}
.rating{font-size:12.5px;display:flex;align-items:center;gap:4px}

/* ---- SEARCH PANEL ---- */
.search-mod{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:10px;display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr auto;box-shadow:var(--shadow)}
.search-mod .sfield{padding:10px 18px;position:relative}
.search-mod .sfield:not(:last-child)::after{content:"";position:absolute;right:0;top:12px;bottom:12px;width:1px;background:var(--line)}
.search-mod .sfield input,.search-mod .sfield select{border:none;padding:2px 0;background:transparent}
.search-mod .sfield input:focus,.search-mod .sfield select:focus{box-shadow:none}
.search-mod .sfield label{margin-bottom:3px}
.search-mod .sgo{display:flex;align-items:center;padding:6px}
.catrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

.explore-layout{display:grid;grid-template-columns:1fr 1.22fr;gap:20px;align-items:flex-start}
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
.fmap{position:sticky;top:88px;height:calc(100vh - 128px);border-radius:var(--rl);overflow:hidden;border:1px solid var(--line);z-index:1}
#map-container{width:100%;height:100%}
.leaflet-popup-content-wrapper{border-radius:10px;padding:4px}
.leaflet-popup-content{margin:8px 12px;font-family:Inter,sans-serif}
.custom-pin{background:var(--ink);color:var(--paper);font-size:11.5px;font-weight:700;padding:6px 9px;border-radius:100px 100px 100px 3px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.25);border:none;white-space:nowrap}
.custom-pin.sel{background:var(--accent);color:#fff;transform:scale(1.15);z-index:500!important}
.listcol{display:flex;flex-direction:column;gap:14px}
.listing-row{display:flex;gap:14px;padding:14px}
.listing-row .pimg{width:104px;height:92px;flex:0 0 104px;margin:0}
.listing-row.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini{font-size:11px;color:var(--graphite);border:1px solid var(--line);padding:3px 8px;border-radius:6px}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:360px}
.gallery>div{border-radius:14px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent)}
.gallery>div:first-child{grid-row:span 2}
.detail-layout{display:grid;grid-template-columns:1.6fr 1fr;gap:32px;align-items:flex-start;margin-top:28px}
.bookpanel{position:sticky;top:92px;padding:22px;border-radius:var(--rl)}
.stat{padding:18px}
.stat .n{font-size:27px;font-weight:700;font-family:'Space Grotesk';margin-top:4px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:13px 22px;border-radius:100px;font-size:13.5px;font-weight:600;z-index:200;box-shadow:var(--shadow);animation:up .2s}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.modal-bg{position:fixed;inset:0;background:rgba(12,13,17,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--card);border-radius:var(--rl);max-width:460px;width:100%;padding:28px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);animation:pop .15s}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.qr{width:150px;height:150px;margin:0 auto;background:#fff;border-radius:10px;padding:8px}
.qr-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;width:100%;height:100%}
.qr-grid div{background:#111}
.progress{display:flex;gap:6px;margin-bottom:24px}
.progress div{flex:1;height:4px;border-radius:3px;background:var(--line)}
.progress div.on{background:var(--accent)}
.step-nav{display:flex;justify-content:space-between;margin-top:24px}
.notifdd{position:absolute;right:24px;top:64px;width:340px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);z-index:60;max-height:420px;overflow:auto}
.notif-item{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13.5px;position:relative}
.notif-item.unread{background:var(--accent-ink)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tabs button{padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--graphite);border-bottom:2px solid transparent;background:none;transition:color .12s ease}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.bottomnav{display:none}
.empty{padding:64px 20px;text-align:center;color:var(--graphite)}
.empty .ic{font-size:34px;margin-bottom:12px}
.chat{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;max-height:450px;overflow-y:auto;padding:10px}
.bubble{padding:12px 16px;border-radius:14px;font-size:14px;max-width:82%}
.bubble.bot{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.bubble.me{background:var(--accent);color:#fff;align-self:flex-end}
.footer{border-top:1px solid var(--line);padding:36px 0;color:var(--graphite);font-size:13px}
.amen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;font-size:13.5px}
.avatars{display:flex;align-items:center}
.avatars .av{width:30px;height:30px;border-radius:50%;background:var(--accent-ink);border:2px solid var(--paper);color:var(--accent);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-8px}
.avatars .av:first-child{margin-left:0}
.listspace-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:56px;align-items:flex-start}
.wsteps{display:flex;gap:16px;margin-bottom:20px;font-size:12.5px;font-weight:600;color:var(--graphite);flex-wrap:wrap}
.wsteps span.on{color:var(--accent)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
@media(max-width:880px){
 nav.mainnav{display:none}
 .hero{padding-top:36px}
 .hero-split{grid-template-columns:1fr;gap:32px}
 .hero-visual{aspect-ratio:16/10}
 .search-mod{grid-template-columns:1fr 1fr;gap:0}
 .search-mod .sfield::after{display:none}
 .grid-cards{grid-template-columns:1fr 1fr}
 .explore-layout{grid-template-columns:1fr}
 .fmap{display:none}
 .fmap.show{display:block;position:fixed;inset:64px 0 62px 0;top:64px;z-index:30;height:auto;border-radius:0}
 .detail-layout{grid-template-columns:1fr}
 .bookpanel{position:static}
 .listspace-layout{grid-template-columns:1fr;gap:32px}
 .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:50;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around}
 .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--graphite);font-weight:600;padding:4px 8px}
 .bottomnav a.active{color:var(--accent)}
 body{padding-bottom:70px}
 .stat{padding:12px}
 section{padding:44px 0}
}
@media(max-width:560px){.grid-cards{grid-template-columns:1fr}.float-card{position:static;margin-top:10px;min-width:0}}
</style>

const NOTIFS=[

{id:"PK-48213",sp:"ps1",status:"upcoming",date:"28 Sep 2026",arrival:"14:00",dur:3,vehicle:"car",total:100},
{id:"PK-48009",sp:"ps3",status:"completed",date:"12 Sep 2026",arrival:"09:00",dur:5,vehicle:"bike",total:185}

let S={theme:localStorage.getItem('pn_theme')||'light',
 saved:JSON.parse(localStorage.getItem('pn_saved')||'[]'),
 compare:JSON.parse(localStorage.getItem('pn_compare')||'[]'),
 notifRead:JSON.parse(localStorage.getItem('pn_notifread')||'[]'),
 sessionBookings:JSON.parse(localStorage.getItem('pn_bookings')||'[]'),
 notifOpen:false, filters:{vehicle:'',price:'',dist:'',avail:false,amen:[],sort:'rec'},
 mapMode:'list', bookStep:0, bookDraft:{}, wizardStep:0, wizard:{amen:[],photos:0}};

let leafletMap = null;
let mapMarkers = {};

function persist(){localStorage.setItem('pn_saved',JSON.stringify(S.saved));localStorage.setItem('pn_compare',JSON.stringify(S.compare));localStorage.setItem('pn_notifread',JSON.stringify(S.notifRead));localStorage.setItem('pn_bookings',JSON.stringify(S.sessionBookings));}
function hash(){return location.hash.slice(1)||'/'}
function nav(h){location.hash=h}
function qp(){const [,q]=location.hash.split('?');const o={};if(q)q.split('&').forEach(p=>{const[k,v]=p.split('=');o[k]=decodeURIComponent(v||'')});return o}
function path(){return location.hash.split('?')[0].slice(1)||'/'}
function spaceById(id){return SPACES.find(s=>s.id===id)}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',S.theme);localStorage.setItem('pn_theme',S.theme);render()}
function toggleSave(id,ev){if(ev)ev.stopPropagation();S.saved=S.saved.includes(id)?S.saved.filter(x=>x!==id):[...S.saved,id];persist();render()}
function toggleCompare(id,ev){if(ev)ev.stopPropagation();if(S.compare.includes(id)){S.compare=S.compare.filter(x=>x!==id)}else{if(S.compare.length>=3){toast('You can compare up to 3 spaces');return}S.compare=[...S.compare,id]}persist();render()}
function toggleNotif(){S.notifOpen=!S.notifOpen;render()}
function markRead(id){if(!S.notifRead.includes(id)){S.notifRead=[...S.notifRead,id];persist();render()}}
function unreadCount(){return NOTIFS.filter(n=>!n.read&&!S.notifRead.includes(n.id)).length}
function amenLabel(i){return AMEN[i]}

// ---------- SHARED UI ----------
function header(){
 const p=path();
 const link=(h,l)=>`<a href="#${h}" class="${p===h?'active':''}">${l}</a>`;
 return `<header class="top"><div class="wrap topbar">
  <a href="#/" class="logo"><span class="dot"></span>PARKARO</a>
  <nav class="mainnav">${link('/explore','Find Parking')}${link('/list-space','List Your Space')}${link('/parkai','ParkAI')}${link('/owner','Owner')}${link('/bookings','Bookings')}</nav>
  <div style="display:flex;gap:8px;align-items:center;position:relative">
   <button class="iconbtn" onclick="toggleNotif()" aria-label="Notifications">${ICON.bell}${unreadCount()>0?'<span class="dot-badge"></span>':''}</button>
   <a class="iconbtn" href="#/saved" aria-label="Saved">${ICON.heartf}</a>
   <button class="iconbtn" onclick="toggleTheme()" aria-label="Toggle theme">${S.theme==='dark'?ICON.sun:ICON.moon}</button>
   ${S.notifOpen?notifDD():''}
  </div>
 </div></header>`;
}
function notifDD(){
 return `<div class="notifdd">${NOTIFS.map(n=>{const unread=!n.read&&!S.notifRead.includes(n.id);
  return `<div class="notif-item ${unread?'unread':''}" onclick="markRead(${n.id})"><strong style="font-size:13px">${n.t}</strong><div class="muted" style="margin-top:2px">${n.d}</div><div class="mini" style="border:none;padding:0;margin-top:4px">${n.time}</div></div>`}).join('')||`<div class="empty"><div class="ic">${ICON.bell}</div>No notifications yet</div>`}</div>`;
}
function bottomNav(){
 const p=path();
 const it=(h,i,l)=>`<a href="#${h}" class="${p===h?'active':''}">${i}<span>${l}</span></a>`;
 return `<div class="bottomnav">${it('/','🏠','Home')}${it('/explore','🧭','Explore')}${it('/bookings','🎫','Bookings')}${it('/saved',ICON.heartf,'Saved')}${it('/owner','👤','Profile')}</div>`;
}
function stars(r){return ICON.star+' '+(r?r.toFixed(1):'4.5')}

function pcard(s){
 const isSaved=S.saved.includes(s.id);const isCmp=S.compare.includes(s.id);
 return `<div class="card pcard" onclick="nav('/listing/${s.id}')" style="cursor:pointer">
  <div class="pimg" style="background-image:url('${s.image}')">
   <button class="heart ${isSaved?'on':''}" onclick="toggleSave('${s.id}',event)" aria-label="Save">${isSaved?ICON.heartf:ICON.heart}</button>
  </div>
  <div class="pname">${s.name}</div>
  <div class="muted" style="font-size:12.5px">${s.area}, ${s.city} · ${s.distance} km</div>
  <div class="badge-row">${s.amen.slice(0,2).map(i=>`<span class="mini">${amenLabel(i)}</span>`).join('')}${s.avail===0?'<span class="mini" style="color:var(--warn)">Full</span>':''}</div>
  <div class="prow"><span class="price">₹${s.price}<span class="muted" style="font-weight:400">/hr</span></span><span class="rating">${stars(s.rating)} <span class="muted">(${s.reviews})</span></span></div>
  <label style="display:flex;align-items:center;gap:6px;margin-top:9px;font-weight:400;font-size:12px" onclick="event.stopPropagation()"><input type="checkbox" style="width:auto" ${isCmp?'checked':''} onchange="toggleCompare('${s.id}',event)"> Compare</label>
 </div>`;
}

// ---------- HOME ----------
function viewHome(){
 return `<section class="hero"><div class="wrap">
  <div class="hero-split">
   <div>
    <div class="eyebrow">PARKARO</div>
    <h1>Hunt less.<br><span>Park more.</span></h1>
    <p>Discover convenient parking spaces near where you're going in Bhopal — or turn your unused space into a source of income.</p>

   </div>
   <div class="hero-visual">

    <div class="float-card f2"><span class="fdot"></span><div><div class="fl">Owners earned today</div><div class="fv">₹18,920</div></div></div>
   </div>
  </div>

   <div class="sgo"><button class="btn btn-p" onclick="homeSearch()">Find Parking</button></div>
  </div>
  <datalist id="cities">${SPACES.map(s=>`<option value="${s.name}">`).join('')}${SPACES.map(s=>`<option value="${s.area}">`).join('')}</datalist>
  <div class="catrow">${['Near Me','Office','Airport','Mall','Hospital','Downtown'].map(c=>`<a class="chip" href="#/explore${c==='Near Me'?'':'?q='+encodeURIComponent(c)}">${c}</a>`).join('')}<a class="chip" href="#/list-space" style="border:none;background:none;color:var(--graphite)">List Your Space</a><a class="chip" href="#/parkai" style="border:none;background:none;color:var(--graphite)">Ask ParkAI →</a></div>
 </div></section>
 <section><div class="wrap">
  <h2 style="font-size:23px;margin:0 0 6px;letter-spacing:-.01em">Popular right now in Bhopal</h2>
  <p class="muted" style="margin:0 0 24px">Highly rated spaces near Bhopal's busiest hubs and markets.</p>
  <div class="grid-cards">${SPACES.slice(0,6).map(s=>pcard(s)).join('')}</div>
 </div></section>`;
}
function homeSearch(){const q=document.getElementById('hq').value;nav('/explore'+(q?`?q=${encodeURIComponent(q)}`:''))}

// ---------- EXPLORE ----------
function matchesQuery(s,q){
 if(!q)return true;
 q=q.toLowerCase();
 return [s.name,s.area,s.city,s.address,s.landmark,s.type,...s.amen.map(amenLabel)].join(' ').toLowerCase().includes(q);
}
function filteredSpaces(){
 const q=(qp().q||'').trim();
 let list=SPACES.filter(s=>matchesQuery(s,q));
 const f=S.filters;
 if(f.vehicle)list=list.filter(s=>s.vehicles.includes(f.vehicle));
 if(f.price==='low')list=list.filter(s=>s.price<=20);
 if(f.price==='mid')list=list.filter(s=>s.price>20&&s.price<=30);
 if(f.price==='high')list=list.filter(s=>s.price>30);
 if(f.dist==='1')list=list.filter(s=>s.distance<=2);
 if(f.dist==='3')list=list.filter(s=>s.distance<=4);
 if(f.avail)list=list.filter(s=>s.avail>0);
 if(f.sort==='dist')list=[...list].sort((a,b)=>a.distance-b.distance);
 else if(f.sort==='price')list=[...list].sort((a,b)=>a.price-b.price);
 else if(f.sort==='rating')list=[...list].sort((a,b)=>b.rating-a.rating);
 return list;
}
function viewExplore(){
 const q=qp().q||'';
 return `<div class="wrap" style="padding-top:18px">
  <div style="display:flex;gap:10px;align-items:center">
   <input id="searchInput" placeholder="Search by name, area (e.g. MP Nagar, Arera Colony, DB City)..." value="${q}" oninput="onSearchInput(this.value)" style="max-width:420px">
   ${q?`<button class="btn btn-ghost" onclick="clearSearch()">Clear search</button>`:''}
   <span class="muted" id="resultsCount" style="margin-left:auto;font-size:13.5px"></span>
  </div>
  <div class="filterbar" id="filterbar"></div>
  <div class="explore-layout" style="margin-top:16px">
   <div class="listcol" id="resultsWrap"></div>
   <div class="fmap"><div id="map-container"></div></div>
  </div>
 </div>`;
}

function filterbarHTML(){
 const f=S.filters;
 const veh=(v,l)=>`<button class="chip ${f.vehicle===v?'on':''}" onclick="setFilter('vehicle','${f.vehicle===v?'':v}')">${l}</button>`;
 return `${veh('car','Car')}${veh('bike','Bike')}${veh('suv','SUV')}${veh('ev','EV')}
  <select onchange="setFilter('price',this.value)" style="width:auto"><option value="">Any price</option><option value="low" ${f.price==='low'?'selected':''}>₹0–20/hr</option><option value="mid" ${f.price==='mid'?'selected':''}>₹20–30/hr</option><option value="high" ${f.price==='high'?'selected':''}>₹30+/hr</option></select>
  <button class="chip ${f.avail?'on':''}" onclick="setFilter('avail',${!f.avail})">Available now</button>`;
}
function setFilter(k,v){S.filters[k]=v;refreshExplore()}
function onSearchInput(v){const h='/explore'+(v?`?q=${encodeURIComponent(v)}`:'');history.replaceState(null,'',location.pathname+'#'+h);refreshExplore()}
function clearSearch(){document.getElementById('searchInput').value='';onSearchInput('')}

function resultsListHTML(list){
 if(!list.length)return `<div class="empty"><div class="ic">🔍</div><strong>No parking spaces found</strong></div>`;
 return list.map(s=>`<div class="card listing-row" id="row-${s.id}" onclick="nav('/listing/${s.id}')" style="cursor:pointer" onmouseenter="hoverPin('${s.id}',true)" onmouseleave="hoverPin('${s.id}',false)">
  <div class="pimg" style="background-image:url('${s.image}')"></div>
  <div style="flex:1;min-width:0">
   <div style="display:flex;justify-content:space-between"><div class="pname">${s.name}</div><button class="heart ${S.saved.includes(s.id)?'on':''}" style="position:static;width:26px;height:26px" onclick="toggleSave('${s.id}',event)">${S.saved.includes(s.id)?ICON.heartf:ICON.heart}</button></div>
   <div class="muted" style="font-size:12.5px">${s.area}, ${s.city} · ${s.distance} km</div>
   <div class="prow"><span class="price">₹${s.price}/hr</span><span class="rating">${stars(s.rating)}</span></div>
  </div></div>`).join('');
}

function initBhopalMap(list){
 const mapContainer = document.getElementById('map-container');
 if(!mapContainer) return;
 
 if(!leafletMap){
   leafletMap = L.map('map-container').setView([23.2599, 77.4126], 12);
   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
     attribution: '&copy; OpenStreetMap'
   }).addTo(leafletMap);
 }

 Object.values(mapMarkers).forEach(m => leafletMap.removeLayer(m));
 mapMarkers = {};

 list.forEach(s => {
   const customIcon = L.divIcon({
     className: 'custom-pin-wrap',
     html: `<div class="custom-pin" id="pin-${s.id}">₹${s.price}</div>`,
     iconSize: [40, 24],
     iconAnchor: [20, 24]
   });

   const marker = L.marker([s.lat, s.lng], { icon: customIcon }).addTo(leafletMap);
   marker.on('click', () => nav('/listing/' + s.id));
   mapMarkers[s.id] = marker;
 });
}

function hoverPin(id,on){
 const pin=document.getElementById('pin-'+id),row=document.getElementById('row-'+id);
 if(pin)pin.classList.toggle('sel',on);
 if(row)row.classList.toggle('sel',on);
}

function refreshExplore(){
 const list=filteredSpaces();
 const fb = document.getElementById('filterbar'); if(fb) fb.innerHTML=filterbarHTML();
 const rw = document.getElementById('resultsWrap'); if(rw) rw.innerHTML=resultsListHTML(list);
 const rc = document.getElementById('resultsCount'); if(rc) rc.textContent=list.length+' parking spaces in Bhopal';
 initBhopalMap(list);
}

// ---------- ROUTER ----------
function render(){
 document.documentElement.setAttribute('data-theme',S.theme);
 const p=path();
 let body='';
 if(p==='/')body=viewHome();
 else if(p==='/explore')body=viewExplore();
 else if(p.startsWith('/listing/'))body=viewListing(p.split('/')[2]);
 else if(p==='/saved')body=viewSaved();
 else if(p==='/parkai')body=viewParkAI();
 else if(p==='/bookings')body=viewBookings();
 else if(p==='/owner')body=viewOwner();
 else if(p==='/list-space')body=viewListSpace();
 else body=viewHome();
 
 document.getElementById('root').innerHTML=header()+body+bottomNav();
 if(p==='/explore') refreshExplore();
}

window.addEventListener('hashchange',render);
render();
</script>
